services:
  # --- build db (SQL SERVER) ---
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_server_container
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=kXP4$'0}9E+)  #password!
    ports:
      - "1433:1433" #db port
    volumes:
      - sql_data_v2:/var/opt/mssql/data # prevention od cleaning data after restart

  # --- build backend (.NET) ---
  backend:
    # hot reload needs SDK
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: backend_container
    
    working_dir: /app/CA_Presentation
    
    # watch command watches and restart server after changes - hot reload
    command: dotnet watch run --urls=http://+:8080
    
    ports:
      - "5118:8080"
    
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # SQL Server connection string
      - ConnectionStrings__DefaultConnection=Server=db;Database=CleanArchDB;User Id=sa;Password=kXP4$'0}9E+);TrustServerCertificate=True;
    
    depends_on:
      - db
    
    volumes:
      - ./backend:/app
      - /app/CA_Presentation/bin
      - /app/CA_Presentation/obj

  #--- build frontend (TS React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_container
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5118/api  #connect via localhost (temp)
    volumes:
      - ./frontend:/app #live reload
      - /app/node_moduleskk
    depends_on:
      - backend #frontend waiting for backend

volumes:
  sql_data_v2: